# Render Blueprint for the FastAPI backend.
# Neon is used for Postgres + pgvector; Render only runs the web service.
services:
  - type: web
    name: rag-chatbot-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./rag_chatbot_backend/Dockerfile
    dockerContext: ./rag_chatbot_backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Neon pooled connection string, converted to asyncpg:
      # postgresql+asyncpg://USER:PASSWORD@HOST/DB?ssl=require
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TITLE_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite

      # Gemini embeddings replace the local Ollama container on free hosting.
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBED_DIM
        value: "1536"
      - key: GEMINI_EMBED_BATCH_SIZE
        value: "50"
      - key: GEMINI_EMBED_MAX_RETRIES
        value: "3"

      # Semantic chunking makes one embedding request per sentence; disable it
      # on the Gemini free tier to avoid 429s and slow uploads.
      - key: SEMANTIC_CHUNKING_ENABLED
        value: "false"

      - key: ENVIRONMENT
        value: production
      - key: STORAGE_DIR
        value: /tmp/rag_uploads
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"

      # Set this to the exact Vercel origin, including https://.
      # Example: ["https://rag-chatbot.vercel.app"]
      - key: BACKEND_CORS_ORIGINS
        sync: false
